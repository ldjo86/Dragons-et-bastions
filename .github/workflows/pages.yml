name: Construire et publier le wiki illustré
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer le moteur de rendu
        run: python -m pip install -r requirements.txt
      - name: Construire les crafts et la page unique
        run: python tools/build_wiki.py
      - name: Vérifier les pages, les images et les liens
        run: python tools/check_wiki.py
      - name: Enregistrer le site calculé dans le dépôt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html site/generated
          if ! git diff --cached --quiet; then
            git commit -m 'Wiki : actualiser les crafts illustrés et la page unique [skip ci]'
            git push origin HEAD:main
          fi
      - name: Conserver le wiki complet
        uses: actions/upload-artifact@v4
        with:
          name: wiki-complet
          path: site
      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
