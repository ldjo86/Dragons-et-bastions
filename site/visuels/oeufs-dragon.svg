<svg xmlns="http://www.w3.org/2000/svg" width="660" height="708" viewBox="0 0 660 708" role="img" aria-labelledby="titre description"><title id="titre">Les trois stades des œufs de dragon rouge, vert et bleu</title><desc id="description">Rendus hors jeu du modèle d'œuf Minecraft 26.2 avec les neuf textures présentes dans le JAR Ballista 0.27.1. Colonnes : début, première fissure à 13 minutes 20 secondes, seconde fissure à 26 minutes 40 secondes. Éclosion à 40 minutes si les conditions restent satisfaites.</desc><rect width="660" height="708" rx="12" fill="#1c2119"/><g font-family="system-ui,sans-serif" fill="#f3f0df"><text x="24" y="38" font-size="23" font-weight="700">Les étapes de la coquille</text><g text-anchor="middle" font-size="16"><text x="234" y="78">Début</text><text x="378" y="78">13 min 20 s</text><text x="522" y="78">26 min 40 s</text></g><g font-size="18" font-weight="700"><text x="24" y="194">Rouge</text><text x="24" y="374">Vert</text><text x="24" y="554">Bleu</text></g><text x="24" y="666" font-size="16">Éclosion : 40 min de chaleur et de simulation active.</text><text x="24" y="691" font-size="13" fill="#b9bcae">Rendus des modèles réels, hors jeu. Durées à 20 ticks/s.</text></g><g stroke="#404b37" fill="none"><path d="M162 94H594V634H162Z M306 94V634 M450 94V634 M162 274H594 M162 454H594"/></g><image x="162" y="94" width="432" height="540" style="image-rendering:pixelated" href="data:image/png;base64,"/></svg>